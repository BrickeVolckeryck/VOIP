;=============================
; TRANSPORT
;=============================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
local_net=192.168.250.0/24

;=============================
; EXTENSION 1001
;=============================
[1001]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,opus
auth=1001-auth
aors=1001
direct_media=no
message_context=messages

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=1001pass

[1001]
type=aor
max_contacts=3

