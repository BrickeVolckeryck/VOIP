[general]
static=yes
writeprotect=no

[default]

exten => 600,1,Answer()
 same  => n,ConfBridge(1,default_bridge,user_profile)
 same  => n,Hangup()

; for admins joining the confbdridge call
exten => 601,1,Answer()
 same  => n,ConfBridge(1,default_bridge,admin_profile)
 same  => n,Hangup()

; for normal calling between users
exten => _1XXX,1,NoOp(Calling ${EXTEN})
 same  => n,Dial(PJSIP/${EXTEN},20)
 same  => n,Hangup()

[messages]
exten => _1XXX,1,NoOp(SIP MESSAGE to ${EXTEN} from ${CALLERID(num)})
 same  => n,MessageSend(pjsip:${EXTEN},${CALLERID(num)})
 same  => n,Hangup()
